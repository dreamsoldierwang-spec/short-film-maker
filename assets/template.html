<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>短片模板 · 复制即改</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#0c0a08}
  canvas{display:block}
  .layer{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
  /* 标题块（片头/闪回） */
  #title{position:absolute;left:7%;top:14%;opacity:0;transition:opacity .6s;color:#f3e6c8;text-shadow:0 2px 10px rgba(0,0,0,.7);font-family:"Songti SC","STSong",serif}
  #title.show{opacity:1}
  #title .nm{display:block;font-size:46px;letter-spacing:6px}
  #title .rg{display:block;font-size:20px;opacity:.8;margin-top:6px;letter-spacing:3px}
  #title .tg{display:block;font-size:16px;opacity:.6;margin-top:2px}
  /* 底部逐字字幕 */
  #subtitle{position:absolute;left:0;right:0;bottom:7%;text-align:center;color:#f3e6c8;font:22px/1.6 "Songti SC",serif;text-shadow:0 0 5px rgba(0,0,0,.85),0 1px 12px rgba(0,0,0,.7);opacity:0}
  #subtitle.on{opacity:1}
  #subtitle span{display:inline-block}
  /* Intertitle 字幕卡（片头/片尾大字） */
  #logcover{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(12,10,8,.0);color:#f3e6c8;font-family:"Songti SC",serif;text-align:center;opacity:0;transition:opacity .8s}
  #logcover.show{display:flex;opacity:1}
  #logcover.close{opacity:0}
  #logcover .main{font-size:64px;letter-spacing:10px;text-shadow:0 3px 18px rgba(0,0,0,.8)}
  #logcover .foot{font-size:22px;opacity:.8;margin-top:18px;letter-spacing:4px}
  #logcover .seal{margin-top:26px;font-size:18px;border:2px solid #b23a2e;color:#b23a2e;padding:6px 14px;border-radius:4px;letter-spacing:3px}
  /* 右下折角页码（母题） */
  #logfolio{position:absolute;right:3%;bottom:4%;color:#caa86a;font:15px/1 "Songti SC",serif;opacity:0;border-bottom:1px solid #caa86a;padding-bottom:2px}
  #logfolio.flip{animation:flip .5s ease}
  @keyframes flip{from{opacity:0;transform:rotateX(80deg)}to{opacity:1;transform:rotateX(0)}}
  /* 白闪 / 烧焦边 */
  #flash{position:absolute;inset:0;background:#fff;opacity:0;mix-blend-mode:screen}
  #burn{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 120px 40px rgba(40,16,6,.0);opacity:0}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#caa86a;color:#2B2018;font:18px/1.8 serif;text-align:center;z-index:99;padding:30px}
</style>
</head>
<body>
<div id="title" class="layer"><span class="nm"></span><span class="rg"></span><span class="tg"></span></div>
<div id="subtitle" class="layer"></div>
<div id="logcover" class="layer"><div class="main"></div><div class="foot"></div><div class="seal"></div></div>
<div id="logfolio" class="layer">第 <span id="logfolioNum">01</span> 帧</div>
<div id="flash" class="layer"></div>
<div id="burn" class="layer"></div>
<div id="err"></div>

<script type="module">
/* ============================================================
   短片模板（复古电影风骨架）— 复制本文件、改 SHOTS 与 buildShotN 即可
   关键：多 CDN 兜底 + 关 ColorManagement + sepia 后处理 + 1.4s 叠化循环 + __seek
   ============================================================ */
const W = 1920, H = 1080;
const params = new URLSearchParams(location.search);
let DURATION = parseFloat(params.get('duration')) || 120;
const TRANS = 1.4;
const CHARPS = 16; // 字幕逐字速度（仅显示用）

/* ---------- 1. 多 CDN 兜底加载 THREE ---------- */
async function loadTHREE(){
  const urls = [
    'https://esm.sh/three@0.160.0',
    'https://unpkg.com/three@0.160.0/build/three.module.js',
    'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js',
  ];
  for (const u of urls){
    try { const m = await import(u); if (m && m.WebGLRenderer) return m; } catch(e){}
  }
  return null;
}
const THREE = await loadTHREE();
if (!THREE){
  document.getElementById('err').style.display='flex';
  document.getElementById('err').innerHTML='Three.js 加载失败（三个 CDN 均不可达）<br>请检查网络后刷新';
  throw new Error('Three.js unavailable');
}
/* ★ 关键：关掉色彩管理，否则强调色被当线性色渲染、发暗发灰（靛蓝会被洗没） */
THREE.ColorManagement.enabled = false;

/* ---------- 2. 渲染器 / 相机 / 后处理 ---------- */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-W/2, W/2, H/2, -H/2, 0.1, 100);
camera.position.z = 10;

const rt = new THREE.WebGLRenderTarget(W, H);
const postScene = new THREE.Scene();
const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const postMat = new THREE.ShaderMaterial({
  uniforms: { tDiffuse:{ value:null }, uTime:{ value:0 }, uFlash:{ value:0 }, uBurn:{ value:0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`,
  fragmentShader: `
    varying vec2 vUv; uniform sampler2D tDiffuse; uniform float uTime; uniform float uFlash; uniform float uBurn;
    float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
    void main(){
      vec3 col = texture2D(tDiffuse, vUv).rgb;
      // 饱和度保留的 sepia（越饱和越不洗）
      float mx = max(col.r, max(col.g, col.b));
      float mn = min(col.r, min(col.g, col.b));
      float sat = clamp((mx - mn - 0.10)*4.5, 0.0, 1.0);
      vec3 sep; sep.r = dot(col, vec3(0.393,0.769,0.189));
      sep.g = dot(col, vec3(0.349,0.686,0.168));
      sep.b = dot(col, vec3(0.272,0.534,0.131));
      sep = clamp(sep*1.06, 0.0, 1.0);
      col = mix(col, sep, 0.90*(1.0 - sat*0.82));
      // 颗粒
      float g = hash(vUv*vec2(1920.0,1080.0) + uTime*60.0);
      col += (g - 0.5)*0.06;
      // 竖向划痕
      float sc = step(0.998, hash(vec2(floor(vUv.x*200.0), floor(uTime*2.0))));
      col += sc*0.15;
      // 暗角
      float d = distance(vUv, vec2(0.5));
      col *= smoothstep(0.85, 0.35, d)*0.35 + 0.65;
      // 跳片（每 ~2s 纵向抖）
      float jump = step(0.97, hash(vec2(floor(uTime*0.5), 3.0)));
      col *= 1.0 - jump*0.25;
      // 白闪
      col = mix(col, vec3(1.0), uFlash);
      // 烧焦边
      float edge = smoothstep(0.0, 0.12, min(min(vUv.x,1.0-vUv.x), min(vUv.y,1.0-vUv.y)));
      col = mix(vec3(0.12,0.05,0.02), col, mix(1.0, edge, uBurn));
      gl_FragColor = vec4(col, 1.0);
    }`
});
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), postMat));

/* ---------- 3. helper ---------- */
function reg(group, idx, mesh, order){ mesh.renderOrder = order; group.add(mesh); }
function fillShape(pts, z, color, idx, order){
  const sh = new THREE.Shape(pts); const geo = new THREE.ShapeGeometry(sh);
  const m = new THREE.MeshBasicMaterial({ color, transparent:true, opacity:1 });
  const mesh = new THREE.Mesh(geo, m); mesh.position.z = z; mesh.userData.baseOpacity = 1;
  return { mesh, reg:(g,i,mm,o)=>reg(g,i,mm,o), r:(g)=>reg(g, idx, mesh, order) };
}
function lineFromPts(pts, color, w, idx, order){
  const g = new THREE.BufferGeometry().setFromPoints(pts);
  const m = new THREE.LineBasicMaterial({ color, transparent:true, opacity:1 });
  const line = new THREE.Line(g, m); line.userData.baseOpacity = 1;
  return { obj:line, reg:(group)=>reg(group, idx, line, order) };
}
function ribbonFromPts(pts, w, z, color, idx, order, opacity){
  const left=[], right=[];
  for(let i=0;i<pts.length;i++){
    const p=pts[i], a=pts[Math.max(0,i-1)], b=pts[Math.min(pts.length-1,i+1)];
    const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy)||1; const nx=-dy/len*w/2, ny=dx/len*w/2;
    left.push(new THREE.Vector2(p.x+nx, p.y+ny)); right.push(new THREE.Vector2(p.x-nx, p.y-ny));
  }
  const poly = left.concat(right.reverse());
  return fillShape(poly, z, color, idx, order);
}
function makePaperMaterial(dark){
  const c = dark ? '#2a241a' : '#d8c49a';
  const m = new THREE.MeshBasicMaterial({ color:c, transparent:true, opacity:1 });
  return m;
}
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rnd = mulberry32(20241008);

/* 强调色调色板（相邻镜头不重复地轮换） */
const ACCENT = { jin:'#C9A227', zhu:'#B23A2E', qing:'#2E4A7D', song:'#6E8B5A' };

/* ---------- 4. 占位分镜（替换为你故事的 buildShotN） ---------- */
/* 每个 buildShotN 返回 { group, update? }。占位内容：一块强调色多边形 + 轻微浮动，
   仅用于演示「可运行/可循环/非静止」；请用真实剪影/场景替换函数体。 */
function polyShape(idx){
  const k = 4 + idx, R = 110 + idx*10;
  const pts = [];
  for (let i=0;i<k;i++){ const a = i/k*Math.PI*2; pts.push(new THREE.Vector2(Math.cos(a)*R, Math.sin(a)*R)); }
  return pts;
}
function buildShot(idx){
  const s = SHOTS[idx-1];
  const ac = ACCENT[s.accent] || '#888';
  const g = new THREE.Group();
  const bg = makePaperMaterial(false);
  const bgm = new THREE.Mesh(new THREE.PlaneGeometry(W,H), bg); bgm.position.z = -50; bgm.userData.baseOpacity = 1; reg(g, idx, bgm, 0);
  const shape = fillShape(polyShape(idx), -20, ac, idx, 10);
  // 占位用全透明实色，演示「小面积饱和强调色经 sepia 仍存活」；真实分镜可改透明度
  shape.mesh.material.opacity = 1.0; shape.mesh.userData.baseOpacity = 1.0; shape.r(g);
  // === 填充此镜：在此加入你故事的真实元素（makeShip / 人物 / 场景 等） ===
  return { group:g, update:(t, lt)=>{ shape.mesh.rotation.z = Math.sin(lt*1.5)*0.12; } };
}

const SHOTS = [
  { start:0,   dur:5,  dark:false, accent:'jin',  group:null, update:null, title:['片名','副标题一','副标题二'], sub:'', intertitle:'title' },
  { start:5,   dur:13, dark:false, accent:'zhu',  group:null, update:null, title:['第二镜','地点','说明'], sub:'第二镜屏幕字幕' },
  { start:18,  dur:13, dark:false, accent:'qing', group:null, update:null, title:['第三镜','地点','说明'], sub:'第三镜屏幕字幕' },
  { start:31,  dur:12, dark:false, accent:'song', group:null, update:null, title:['第四镜','地点','说明'], sub:'第四镜屏幕字幕' },
  { start:43,  dur:13, dark:true,  accent:'jin',  group:null, update:null, title:['第五镜','地点','说明'], sub:'第五镜屏幕字幕' },
  { start:56,  dur:12, dark:false, accent:'song', group:null, update:null, title:['第六镜','地点','说明'], sub:'第六镜屏幕字幕' },
  { start:68,  dur:13, dark:false, accent:'zhu',  group:null, update:null, title:['第七镜','地点','说明'], sub:'第七镜屏幕字幕' },
  { start:81,  dur:13, dark:false, accent:'qing', group:null, update:null, title:['第八镜','地点','说明'], sub:'第八镜屏幕字幕' },
  { start:94,  dur:12, dark:false, accent:'jin',  group:null, update:null, title:['第九镜','地点','说明'], sub:'第九镜屏幕字幕' },
  { start:106, dur:14, dark:false, accent:'zhu',  group:null, update:null, title:['',' ',''], sub:'', intertitle:'end' },
];
// 构建各镜（单镜只 build 一次）
for (let i=1;i<=SHOTS.length;i++){ try { const b = buildShot(i); SHOTS[i-1].group = b.group; SHOTS[i-1].update = b.update; if(b.group) scene.add(b.group); } catch(e){ console.error('shot',i,e); } }

/* ---------- 5. 导演层（叠化 / 文字 / 特效） ---------- */
function smooth(x){ x=Math.max(0,Math.min(1,x)); return x*x*(3-2*x); }
function setGroupAlpha(g, a){
  g.traverse(o=>{
    if(!o.material) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    mats.forEach(m=>{
      // 首次调用时自动记住初始 opacity 作为 base，后续用 base * a（乘法，别覆盖）
      if(m.userData.baseOpacity===undefined && m.userData._b0===undefined) m.userData._b0 = (m.opacity!==undefined ? m.opacity : 1);
      const base = (m.userData.baseOpacity!==undefined) ? m.userData.baseOpacity : m.userData._b0;
      if(m.uniforms && m.uniforms.uOpacity) m.uniforms.uOpacity.value = base * a;
      else { m.transparent = true; m.opacity = base * a; }
    });
  });
}
const elTitle = document.getElementById('title');
const elSub = document.getElementById('subtitle');
const elCover = document.getElementById('logcover');
const elMain = elCover.querySelector('.main');
const elFoot = elCover.querySelector('.foot');
const elSeal = elCover.querySelector('.seal');
const elFolio = document.getElementById('logfolio');
const elFolioNum = document.getElementById('logfolioNum');
const elFlash = document.getElementById('flash');
const elBurn = document.getElementById('burn');
let folioShown = -1;

function renderSubtitle(text, lt){
  const n = Math.max(0, Math.min(text.length, Math.floor(lt*CHARPS)));
  elSub.innerHTML = text.slice(0,n).split('').map(c=>`<span>${c}</span>`).join('');
}
function setCover(mode){
  if (mode==='title'){ elMain.textContent='片名'; elFoot.textContent='副标题'; elSeal.textContent='印'; }
  else { elMain.textContent='完'; elFoot.textContent='结尾文案'; elSeal.textContent='剧终'; }
}

const clock = new THREE.Clock();
let seekOffset = 0;
window.__seek = (t)=>{ seekOffset = t - clock.elapsedTime; };

function frame(){
  const tRaw = clock.elapsedTime + seekOffset;
  const t = ((tRaw % DURATION) + DURATION) % DURATION;
  postMat.uniforms.uTime.value = t;

  let primary = 0;
  for (let i=0;i<SHOTS.length;i++){ if (t >= SHOTS[i].start) primary = i; }

  for (let i=0;i<SHOTS.length;i++){
    const s = SHOTS[i]; const g = s.group; if (!g) continue;
    const a_in = (s.start===0) ? 1 : smooth((t - s.start)/TRANS);
    const a_out = smooth((t - (s.start + s.dur - TRANS))/TRANS);
    let a = a_in * (1 - a_out);   // ★ 注意是 (1 - a_out)，写成 a_out 会导致镜头显隐反转、首帧全黑
    if (s.start===0){ const tail = smooth((t - (DURATION - TRANS))/TRANS); a = Math.max(a, tail); }
    setGroupAlpha(g, a);
    g.visible = a > 0.001;
    if (s.update) s.update(t, t - s.start, a);
  }

  // 文字层
  const s = SHOTS[primary];
  if (s.intertitle){
    elTitle.classList.remove('show'); elSub.classList.remove('on'); elSub.innerHTML='';
    elCover.classList.add('show'); setCover(s.intertitle); elCover.classList.remove('close');
  } else {
    elCover.classList.remove('show');
    if (s.title && s.title[0]){ elTitle.querySelector('.nm').textContent=s.title[0]; elTitle.querySelector('.rg').textContent=s.title[1]; elTitle.querySelector('.tg').textContent=s.title[2]; elTitle.classList.add('show'); }
    elFolio.classList.add('show'); const num=String(primary+1).padStart(2,'0');
    if (folioShown!==primary){ folioShown=primary; elFolioNum.textContent=num; elFolio.classList.remove('flip'); void elFolio.offsetWidth; elFolio.classList.add('flip'); }
    if (s.sub){ elSub.classList.add('on'); renderSubtitle(s.sub, t - s.start); } else { elSub.classList.remove('on'); }
  }
  if (primary===SHOTS.length-1){ const lt=t-s.start; if (lt>9) elCover.classList.add('close'); elBurn.style.opacity = Math.max(0, Math.min(1, (lt-9)/5)); postMat.uniforms.uBurn.value = parseFloat(elBurn.style.opacity)||0; }

  // 渲染：场景→rt，rt→屏幕（sepia 后处理）
  renderer.setRenderTarget(rt); renderer.render(scene, camera);
  renderer.setRenderTarget(null); postMat.uniforms.tDiffuse.value = rt.texture; renderer.render(postScene, postCam);
  requestAnimationFrame(frame);
}
if (params.has('t')) window.__seek(parseFloat(params.get('t')));
requestAnimationFrame(frame);
</script>
</body>
</html>
